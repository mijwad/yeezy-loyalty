# Render Infrastructure as Code Blueprint
services:
  - type: web
    name: yeezy-loyalty-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://mwwfsyyqqnkpvdgtqmyz.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
