# Render Infrastructure as Code Blueprint
services:
  - type: web
    name: yeezy-loyalty-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://mwwfsyyqqnkpvdgtqmyz.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://beebill.online
      - key: CORS_ORIGINS
        value: https://beebill.online,https://www.beebill.online,https://yeezy-loyalty.vercel.app,https://yeezy-loyalty.onrender.com
      - key: META_APP_ID
        value: "1449921280434310"
      - key: META_PHONE_NUMBER_ID
        value: "1369137272956532"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1369137272956532"
      - key: META_WABA_ID
        value: "1139673141923119"
      - key: WHATSAPP_WABA_ID
        value: "1139673141923119"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: "1234567890qwertyuiopasdf"
